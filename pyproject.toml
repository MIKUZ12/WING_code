[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wing"
version = "0.1.0"
description = "WING robot policy training, benchmark inference, and deployment"
requires-python = ">=3.10"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "accelerate==1.12.0",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "einops==0.8.1",
  "ftfy>=6",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "omegaconf==2.3.0",
  "packaging>=24",
  "pandas==2.2.3",
  "pillow>=10",
  "pyarrow==23.0.0",
  "pyyaml>=6",
  "regex",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torchcodec==0.5",
  "tqdm>=4.66",
  "transformers==4.49.0",
  "typing-extensions>=4.10",
]

[project.optional-dependencies]
train = ["deepspeed==0.18.5", "tensorboard", "wandb==0.23.1"]
data = ["h5py", "scipy"]
test = ["pytest"]

[project.urls]
Homepage = "https://mikuz12.github.io/wing/"
Paper = "https://arxiv.org/abs/2610.03607"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wing*"]
