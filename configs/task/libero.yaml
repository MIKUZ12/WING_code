# @package _global_
defaults:
  - override /data: libero_lam
  - override /model: wing
  - _self_

training_phase: policy
resume: null
partial_resume: null
phase_init:
  path: ${oc.env:PHASE1_SPECTRAL_CHECKPOINT}

batch_size: 16
num_workers: 8
learning_rate: 1.0e-4
backbone_learning_rate: ${learning_rate}
new_module_learning_rate: ${learning_rate}
lr_scheduler_type: cosine
weight_decay: 1.0e-2
num_epochs: 10
max_steps: 40000
log_every: 10
save_every: 10000
eval_every: 0
gradient_accumulation_steps: 1
mixed_precision: bf16

model:
  model_id: ${oc.env:WAN_MODEL_PATH,Wan-AI/Wan2.2-TI2V-5B}
  tokenizer_model_id: ${oc.env:WAN_TOKENIZER_PATH,${model.model_id}}
  action_dit_pretrained_path: ${oc.env:ACTION_DIT_CHECKPOINT}
  redirect_common_files: false

wandb:
  name: wing_libero
