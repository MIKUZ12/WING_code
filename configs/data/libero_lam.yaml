train:
  _target_: wing.datasets.spectral_targets.SpectralTargetDataset
  cache_root: ${oc.env:LAM_CACHE_ROOT,datasets/libero/libero_v2.1/latent_low_4suite_agentview}
  horizon: 8
  target_dim: 32
  max_cached_episodes: 32
  require_complete_cache: true
  verify_manifest_identity: false
  selected_dataset_roots:
    - ${oc.env:LIBERO_V21_ROOT,datasets/libero/libero_v2.1}/libero_spatial_no_noops_lerobot
    - ${oc.env:LIBERO_V21_ROOT,datasets/libero/libero_v2.1}/libero_object_no_noops_lerobot
    - ${oc.env:LIBERO_V21_ROOT,datasets/libero/libero_v2.1}/libero_goal_no_noops_lerobot
    - ${oc.env:LIBERO_V21_ROOT,datasets/libero/libero_v2.1}/libero_10_no_noops_lerobot
  episode_split: all
  episode_holdout_mod: 10
  episode_holdout_remainder: 0
  base_dataset:
    _target_: wing.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs:
      - ${oc.env:LIBERO_V21_ROOT,datasets/libero/libero_v2.1}/libero_spatial_no_noops_lerobot
      - ${oc.env:LIBERO_V21_ROOT,datasets/libero/libero_v2.1}/libero_object_no_noops_lerobot
      - ${oc.env:LIBERO_V21_ROOT,datasets/libero/libero_v2.1}/libero_goal_no_noops_lerobot
      - ${oc.env:LIBERO_V21_ROOT,datasets/libero/libero_v2.1}/libero_10_no_noops_lerobot
    pretrained_norm_stats: ${oc.env:LIBERO_DATASET_STATS,datasets/libero/libero_v2.1/dataset_stats.json}
    shape_meta:
      images:
        - key: image
          raw_shape: [3, 512, 512]
          shape: [3, 224, 224]
        - key: wrist_image
          raw_shape: [3, 512, 512]
          shape: [3, 224, 224]
      action:
        - key: default
          raw_shape: 7
          shape: 7
      state:
        - key: default
          raw_shape: 8
          shape: 8
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    video_size: [224, 448]
    camera_key: null
    val_set_proportion: 0.0
    is_training_set: true
    # Empty keeps online VAE encoding. Set LIBERO_VAE_CACHE to a complete cache
    # produced by scripts/precompute_vae_latents.py to skip RGB decode + VAE.
    vae_latent_cache_dir: ${oc.env:LIBERO_VAE_CACHE,''}
    vae_latent_cache_required: false
    skip_padding_as_possible: false
    concat_multi_camera: horizontal
    processor:
      _target_: wing.datasets.lerobot.processors.wing_processor.WINGProcessor
      shape_meta: ${data.train.base_dataset.shape_meta}
      num_obs_steps: ${data.train.base_dataset.num_frames}
      num_output_cameras: 2
      action_output_dim: 7
      proprio_output_dim: 8
      delta_action_dim_mask:
        default: [true, true, true, true, true, true, false]
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: wing.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
        - _target_: wing.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
      val_transforms:
        - _target_: wing.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
    text_embedding_cache_dir: ${oc.env:LIBERO_TEXT_CACHE,datasets/libero/libero_v2.1/text_embeds_cache}
    context_len: 128

val: null
